limit_req_zone $binary_remote_addr zone=api_global:10m       rate=1000r/m;
limit_req_zone $binary_remote_addr zone=auth_strict:10m      rate=15r/m;
limit_req_zone $binary_remote_addr zone=sensitive_write:10m  rate=60r/m;

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;
    limit_req_status 429;

    # ── Default proxy headers (inherited by location blocks) ──
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # ── Static / media ──
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Auth endpoints —─
    location ~* ^/esg-scoring/api/auth/(login|register|token/refresh)/ {
        limit_req zone=auth_strict burst=6 nodelay;
        proxy_pass http://django;
    }

    # ── Sensitive write endpoints ──
    location ~* ^/esg-scoring/api/(quizzes/today/(start|answer|forfeit)|shop/items/\d+/buy|shop/purchases/\d+/confirm|events/tasks/\d+/verify|projects/\d+/verify)/ {
        limit_req zone=sensitive_write burst=10 nodelay;
        proxy_pass http://django;
    }

    # ── Catch all ──
    location /esg-scoring {
        limit_req zone=api_global burst=50 nodelay;
        proxy_pass http://django;
    }
}
